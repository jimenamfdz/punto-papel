name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: punto_papel_test
          POSTGRES_USER: punto_papel
          POSTGRES_PASSWORD: punto_papel_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U punto_papel -d punto_papel_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar pruebas
        run: mvn -B test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/punto_papel_test
          DB_USERNAME: punto_papel
          DB_PASSWORD: punto_papel_ci
          DB_INTEGRATION_TEST_URL: jdbc:postgresql://localhost:5432/punto_papel_test
