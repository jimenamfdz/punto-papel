services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: punto_papel
      POSTGRES_USER: ${DB_USERNAME:-punto_papel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    volumes:
      - punto-papel-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/punto_papel
      DB_USERNAME: ${DB_USERNAME:-punto_papel}
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    ports:
      - "8080:8080"

volumes:
  punto-papel-db:
