<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Punto &amp; Papel · Productos</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Punto &amp; Papel</p>
      <h1>Inventario</h1>
    </div>
    <a class="api-link" href="/api/productos" target="_blank" rel="noreferrer">Ver API</a>
  </header>

  <main class="layout">
    <section class="panel form-panel">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">Catálogo</p>
          <h2 id="form-title">Registrar producto</h2>
        </div>
        <span id="form-mode" class="badge">Nuevo</span>
      </div>

      <form id="producto-form">
        <input id="producto-id" type="hidden">
        <label for="nombre">Nombre</label>
        <input id="nombre" name="nombre" required maxlength="255" placeholder="Ej. Cuaderno profesional">

        <div class="form-row">
          <div>
            <label for="precio">Precio</label>
            <input id="precio" name="precio" type="number" min="0.01" step="0.01" required placeholder="0.00">
          </div>
          <div>
            <label for="existencias">Existencias</label>
            <input id="existencias" name="existencias" type="number" min="0" step="1" required placeholder="0">
          </div>
        </div>

        <div class="form-actions">
          <button id="guardar" class="button primary" type="submit">Guardar producto</button>
          <button id="cancelar" class="button secondary hidden" type="button">Cancelar edición</button>
        </div>
        <p id="form-message" class="message" role="status"></p>
      </form>
    </section>

    <section class="panel catalog-panel">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">Existencias actuales</p>
          <h2>Productos</h2>
        </div>
        <span id="product-count" class="count">0 productos</span>
      </div>
      <div id="loading" class="empty-state">Cargando productos…</div>
      <div id="product-list" class="product-list" aria-live="polite"></div>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
